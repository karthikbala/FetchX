# Append at the end of sshd_config on the disposable worker only.
Match User fetchx-tunnel
    AuthenticationMethods publickey
    AuthorizedKeysFile /etc/ssh/fetchx-pool.authorized_keys
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowAgentForwarding no
    # OpenSSH 9.6 shares the channel permissions between TCP and Unix sockets.
    AllowTcpForwarding yes
    PermitOpen [/srv/fxpool/run/worker/worker.sock]:*
    PermitListen none
    AllowStreamLocalForwarding yes
    X11Forwarding no
    PermitTTY no
    PermitUserRC no
    MaxSessions 0
    StreamLocalBindMask 0177
    StreamLocalBindUnlink yes
