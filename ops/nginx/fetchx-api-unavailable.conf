# FetchX API: what clients get when the gateway does not answer at all (a
# restart, a crash), instead of nginx's HTML 502 page. Installed on porttrack as
# /etc/nginx/snippets/fetchx-api-unavailable.conf and included once in the
# app.fetchx.ai server block of /etc/nginx/sites-available/fetchx-app:
#
#     include /etc/nginx/snippets/fetchx-api-unavailable.conf;
#
# It only covers errors nginx makes itself (connection refused, upstream
# timeout). Answers the gateway gives, including its own 503 maintenance, pass
# through unchanged, because proxy_intercept_errors stays off.
#
# The body has the API's error shape, with the code `unavailable` that the
# clients already retry with the same idempotency_key. Nothing reached the
# gateway, so nothing was run or charged.

error_page 502 504 = @fetchx_unavailable;

location @fetchx_unavailable {
    default_type application/json;
    add_header Retry-After 30 always;
    add_header Cache-Control "no-store" always;
    return 503 '{"error":{"code":"unavailable","message":"FetchX is not answering right now, usually for a restart. Nothing was run or charged. Retry after Retry-After seconds with the same idempotency_key.","retry_after_seconds":30,"details":{"status_url":"https://fetchx.ai/status","retry_after_seconds":30}}}\n';
}
