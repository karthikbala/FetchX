# FetchX browser sessions: the WebSocket a caller's Playwright connects to
# (wss://app.fetchx.ai/v1/browser-sessions/{id}/ws). Installed on porttrack as
# /etc/nginx/snippets/fetchx-browser-sessions.conf and included once in the
# app.fetchx.ai server block of /etc/nginx/sites-available/fetchx-app:
#
#     include /etc/nginx/snippets/fetchx-browser-sessions.conf;
#
# The include goes above the block's `location ~ ^/(v1|v2|control)`: nginx
# tries regex locations in file order, so below it /v1 would take the path.
# The regex is quoted because nginx reads an unquoted { as a block start.
#
# nginx does not pass an Upgrade on by default, so without this the connect
# fails. The gateway checks the caller's API key itself and carries the
# connection to the engine. FETCHX_GATEWAY below must be the same upstream as
# the server block's `location /` proxy_pass; set it when installing.
#
# A session lasts at most 900 s (ttl_s), and the engine pings every 25 s, so
# the timeouts only need to outlast a quiet stretch of a live session.

location ~ "^/v1/browser-sessions/[0-9a-f-]{36}/ws$" {
    proxy_pass http://FETCHX_GATEWAY;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 1000s;
    proxy_send_timeout 1000s;
}
