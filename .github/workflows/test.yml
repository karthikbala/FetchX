name: FetchX tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fetchx
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: gateway_test_ci
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U fetchx -d gateway_test_ci" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://fetchx:fixture-only-password@localhost:5432/gateway_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install httpx==0.28.1
      - run: python -m unittest discover -s test -p '*_test.py'
      - run: npm ci --ignore-scripts
      - run: npx playwright-core install --with-deps chromium
      - name: Enable sandboxed browser user namespaces in the ephemeral runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test with PostgreSQL and a real browser
        run: BROWSER_TEST_EXECUTABLE="$(node --input-type=module -e 'import {chromium} from "playwright-core"; console.log(chromium.executablePath())')" npm test
